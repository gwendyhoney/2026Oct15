<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Quiz Draft</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <div class="background"><img src="TDU_Quiz_Background.png" class="background"></img></div>
    <script src="QsPasted.js"></script>
    <script src="ShellPasted.js"></script>
    <script src="script.js"></script>

    <button onclick="startQuiz()" id="startbtn">Start</button>
    <button onclick="startQuizRandver()" id="startRandbtn">Start + Randomize</button>

    <div>
      <div class="panel">
        <div class="resultsPage" id="resPg"></div>

        <div class="qsflexwrap">
          <div class="qsDiv" id="qsDiv">
            <div class="qNum" id="qNum"></div>
            <div class="question" id="ques"></div>
            <div class="options" id="opt"></div>
            <div class="optionsShell" id="optshell"></div>
            <br>
            <button onclick="checkAns()" id="submitbtn" style="display:none">NEXT</button>
            <br>
            <button onclick="goBack()" id="backbtn" style="display:none">BACK</button>
            <div class="errorAlert" id="errorAlert"></div>
          </div>

          <div class="scoresPeep" id="scoresPeep">
            <div id="score0"></div>
            <div id="score1"></div>
            <div id="score2"></div>
            <div id="score3"></div>
            <div id="score4"></div>
            <div id="score5"></div>
            <div id="score6"></div>
            <div id="score7"></div>
            <div id="score8"></div>
            <div id="score9"></div>
            <div id="score10"></div>
            <div id="score11"></div>
            <div id="score12"></div>
            <div id="score13"></div>
            <div id="score14"></div>
            <div id="score15"></div>
          </div>
        </div>
    </div>
  </div>
  </body>
</html>
